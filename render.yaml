services:
  - type: web
    name: valuegrid
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
