<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValueGrid — Digital Solutions for Local Businesses</title>
  <meta name="description" content="ValueGrid helps small businesses grow by bringing them online through affordable and practical digital solutions.">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #101010; /* matches ValueGrid dark theme — avoids white flash */
    }
    #vgFrame {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }
    #vgFallback {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #101010;
      color: #f5f5f5;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #vgFallback a {
      color: #ffd166;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!--
    Bridge page that attaches the valuegrid.kesug.com domain to the live
    ValueGrid app hosted on Render. The domain is kept in the address bar
    while the real site renders inside this full-page frame.
  -->
  <iframe id="vgFrame" src="https://valuegrid-8hx8.onrender.com/" title="ValueGrid" allowfullscreen></iframe>

  <div id="vgFallback">
    <div>
      <h2>ValueGrid</h2>
      <p>If this page does not load automatically,
        <a href="https://valuegrid-8hx8.onrender.com/">open the ValueGrid website</a>.
      </p>
    </div>
  </div>

  <script>
    var frame = document.getElementById('vgFrame');
    var fallback = document.getElementById('vgFallback');

    // If the frame is blocked or fails to load, show a manual link.
    frame.addEventListener('error', function () {
      fallback.style.display = 'flex';
    });

    // Some browsers fire 'load' even on blocked frames; sanity-check and show
    // the fallback link if the embedded page can't be reached in 30 seconds
    // (Render free tier takes a few seconds to wake up after sleeping).
    var arrived = false;
    frame.addEventListener('load', function () { arrived = true; });
    setTimeout(function () {
      if (!arrived) fallback.style.display = 'flex';
    }, 30000);
  </script>
</body>
</html>
